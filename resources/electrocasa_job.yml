resources:
  jobs:
    electrocasa_job:
      name: electrocasa_job
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Lima
        pause_status: UNPAUSED
      tasks:
        - task_key: ejecutar_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_spd_dbelectrocasa.id}
          max_retries: 1
          min_retry_interval_millis: 300000
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 1200
          email_notifications:
            on_failure:
              - alexqjave@gmail.com
        - task_key: validar_gold
          depends_on:
            - task_key: ejecutar_pipeline
          sql_task:
            file:
              path: ../src/monitoring/validacion_gold.sql
              source: WORKSPACE
            warehouse_id: 6b156408ff08be7c
          email_notifications:
            on_failure:
              - alexqjave@gmail.com
        - task_key: monitorear_calidad
          depends_on:
            - task_key: validar_gold
          notebook_task:
            notebook_path: ../src/monitoring/monitor_pipeline.ipynb
            source: WORKSPACE
          email_notifications:
            on_failure:
              - alexqjave@gmail.com
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
