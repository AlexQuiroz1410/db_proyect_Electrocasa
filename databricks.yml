bundle:
  name: project_sdp
  uuid: eb9d4db5-1701-4c02-8b33-d63759fe1bfc

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo de Unity Catalog donde este target publica bronze/silver/gold
    default: dbelectrocasa
  schema_bronze:
    description: Schema de la capa Bronze
    default: bronze
  schema_silver:
    description: Schema de la capa Silver
    default: silver
  schema_gold:
    description: Schema de la capa Gold
    default: gold
  landing_path:
    description: Ruta del Volume donde Auto Loader lee los lotes de clientes
    default: /Volumes/dbelectrocasa/default/vol_landing
  landing_path_dev:
    description: Ruta del Volume_Dev donde Auto Loader lee los lotes de clientes
    default: /Volumes/dbelectrocasa_dev/default/vol_landing

targets:
  dev:
    mode: development
    default: true
    presets:
      source_linked_deployment: false
    workspace:
      host: "https://adb-7405606201736253.13.azuredatabricks.net/"
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbelectrocasa_dev
      landing_path: {var.landing_path_dev}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

  test:
    mode: production
    presets:
      source_linked_deployment: false
    workspace:
      host: <url-del-otro-workspace>
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbassociate_test
      landing_path: /Volumes/dbassociate_test/default/vol_landing/input/
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

  prod:
    mode: production
    presets:
      source_linked_deployment: false
    workspace:
      host: <url-del-otro-workspace>
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
